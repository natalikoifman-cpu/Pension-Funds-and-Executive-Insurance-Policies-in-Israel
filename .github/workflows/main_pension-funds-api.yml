# DEPRECATED: This workflow has been superseded by azure-web-deploy.yml
# Kept for reference. The new workflow uses separated build/deploy jobs,
# NuGet caching, path-based triggers, and deployment health checks.
#
# To migrate: ensure AZURE_FUNCTIONAPP_PUBLISH_PROFILE secret is set
# (the same publish profile content works for both secrets).

name: "[Deprecated] Build and deploy - pension-funds-api"

on:
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'FunctionApp'
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Resolve Project Dependencies Using Dotnet'
        shell: pwsh
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet build --configuration Release --output ./output
          popd

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'pension-funds-api-cyekachfb9efa6ej'
          slot-name: 'Production'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D41F3CF8A2B24FC895F2129D3A8D3C3F }}
