name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        if: hashFiles('frontend/src/**/*.{spec,test}.{js,jsx,ts,tsx}', 'frontend/src/**/__tests__/**/*.{js,jsx,ts,tsx}') != ''
        run: CI=1 npm test -- --watchAll=false
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore
        working-directory: FunctionApp

      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: FunctionApp

      - name: Run backend tests
        if: hashFiles('FunctionApp/**/*Test*.csproj', 'FunctionApp/**/*Tests*.csproj') != ''
        working-directory: FunctionApp
        run: |
          set -e
          for project in $(find . \( -name '*Test*.csproj' -o -name '*Tests*.csproj' \)); do
            dotnet test "$project" --configuration Release
          done
